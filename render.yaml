# Render Blueprint - ゲーム単体（game.html）を静的サイトとして配信
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 2d-ninja-slash
    runtime: static
    # devDependencies（vite / typescript）も必要なので --include=dev を付ける
    buildCommand: npm ci --include=dev && npm run build:game
    staticPublishPath: ./dist
    # このゲームは単一ページ（canvas のみ・クライアントルーティング無し）。
    # SPA フォールバックの rewrite はあえて付けない。
    # 付けると、存在しないアセット/JSON へのリクエストにも 200 + index.html(HTML) を返してしまい、
    # Phaser の画像/スプライトデコード失敗（=ゲーム画面が真っ黒）の原因になりうる。
    # rewrite が無ければ実在しないパスは素直に 404 になり、原因の切り分けもしやすい。
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
    headers:
      # 静的アセット（ハッシュ付きJS / 画像 / 音声）は長期キャッシュ
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
